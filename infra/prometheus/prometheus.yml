global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: zolaos
    env: dev

# Règles d'alerte (voir alerts.yml). Un Alertmanager peut être branché ci-dessous.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'zolaos-app'
    static_configs:
      - targets: ['app:8000']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
