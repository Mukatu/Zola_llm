# ============================================================================
# Zolacortex — cortex de PRODUCTION (chez Polaris).
#
# Cockpit cabinet + modèle lourd (70B) + overlays propriétaires. Reçoit les tunnels
# SORTANTS des Zolabox (WebSocket), termine le mTLS au reverse-proxy Caddy (certificat
# client par box vérifié contre la CA Polaris), et vérifie EN PLUS le credential + le CN
# côté application. L'image n'est PAS bâtie en profil box : elle conserve les actifs cabinet.
#
# Config via .env (copier .env.zolacortex.example). Installation : ./install.sh
# ============================================================================
name: zolacortex

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-prod}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  ZOLAOS_PROFILE: cortex

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: zolacortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zolaos}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_MIGRATIONS}
      PWD_MIGRATOR: ${POSTGRES_PASSWORD_MIGRATIONS}
      PWD_APP: ${POSTGRES_PASSWORD_APP}
      PWD_HEALTH: ${POSTGRES_PASSWORD_HEALTH}
      PWD_LEGAL: ${POSTGRES_PASSWORD_LEGAL}
      PWD_ERP: ${POSTGRES_PASSWORD_ERP}
      PWD_CODE: ${POSTGRES_PASSWORD_CODE}
      PWD_AUDIT_W: ${POSTGRES_PASSWORD_AUDIT_W}
      PWD_AUDIT_R: ${POSTGRES_PASSWORD_AUDIT_R}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/postgres/00_bootstrap.sh:/docker-entrypoint-initdb.d/00_bootstrap.sh:ro
      - ../../infra/postgres/01_init_schemas.sql:/infra/01_init_schemas.sql:ro
      - ../../infra/postgres/02_audit_log.sql:/infra/02_audit_log.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-zolaos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zolacortex-net]

  redis:
    image: redis:7-alpine
    container_name: zolacortex-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zolacortex-net]

  minio:
    image: minio/minio:latest
    container_name: zolacortex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [zolacortex-net]

  # Modèles : 8B (routeur) + 70B (cœur des missions). GPU fortement recommandé.
  ollama:
    image: ollama/ollama:latest
    container_name: zolacortex-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama
    # GPU quasi indispensable pour le 70B — décommenter (nvidia-container-toolkit) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [zolacortex-net]

  migrate:
    build: {context: ../.., dockerfile: Dockerfile, args: {ZOLAOS_PROFILE: cortex}}
    image: zolacortex:${ZOLAOS_VERSION:-latest}
    container_name: zolacortex-migrate
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: .env
    environment:
      <<: *common-env
      POSTGRES_HOST: postgres
    depends_on:
      postgres: {condition: service_healthy}
    networks: [zolacortex-net]

  app:
    build: {context: ../.., dockerfile: Dockerfile, args: {ZOLAOS_PROFILE: cortex}}
    image: zolacortex:${ZOLAOS_VERSION:-latest}
    container_name: zolacortex-app
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      LLM_BACKEND: llamacpp
      LLM_HOST_ROUTER: http://ollama:11434
      LLM_HOST_CORE: http://ollama:11434
      # Exige l'identité de certificat client transmise par Caddy (mTLS).
      TUNNEL_REQUIRE_CLIENT_CERT: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      ollama: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [zolacortex-net]

  # Caddy : HTTPS pour le cockpit + tunnel mTLS (vérifie le cert client vs CA Polaris).
  caddy:
    image: caddy:2-alpine
    container_name: zolacortex-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      CORTEX_DOMAIN: ${CORTEX_DOMAIN:-cortex.localhost}
      CORTEX_TUNNEL_DOMAIN: ${CORTEX_TUNNEL_DOMAIN:-tunnel.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pki/certs/polaris-ca.crt:/certs/polaris-ca.crt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [zolacortex-net]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  caddy_data:
  caddy_config:

networks:
  zolacortex-net:
    driver: bridge
