# Manifeste d'ingestion RAG — ZolaOS
# =====================================================================
# Liste les corpus à charger dans les bases de connaissance RAG. Sources
# qualifiées par le sourcing du 2026-07-03 (voir docs/sourcing/*.md).
#
# Exécution : scripts/ingest_from_manifest.py  (nécessite bge-m3 baké —
# cf. docs/RAG_INGESTION.md). Toujours tester en --dry-run d'abord.
#
# Champs :
#   id       identifiant stable (= source_id pour les PDF)
#   method   hf_dataset | pdf
#   status   ready   = URL directe vérifiée, licence OK → ingérable
#            pending = à confirmer/contacter/négocier (licence, accès, décision)
#   verify   true si l'URL doit être re-testée avant ingestion (flag du sourcing)
#   license  licence / conditions de réutilisation
#   schema/tags/pii  paramètres d'ingestion (PDF)
# =====================================================================

defaults:
  pii: none # texte réglementaire public par défaut

corpora:
  # ---- OHADA (dataset HuggingFace) -------------------------------------
  - id: ohada_actes
    method: hf_dataset
    dataset: Maathis-com/ohada-actes-uniformes
    license: CC-BY-4.0
    status: ready
    note: >-
      Routage automatique par ingest_ohada.py — AUDCIF→rag_erp,
      8 autres actes→rag_legal. Nécessite HF_TOKEN au build/exécution.

