  # ---- Fintech réglementaire (rag_fintech) — COBAC / GABAC / BEAC ------
  # Sourcing 2026-07-17. Les 4 URLs ont été vérifiées (HTTP 200,
  # application/pdf). sgg.cg = Secrétariat Général du Gouvernement CG, déjà
  # source du code des marchés publics ci-dessus. beac.int = banque centrale.
  # Ces textes remplacent la fiche d'orientation `validated:false` : ce sont
  # eux qui portent les seuils et ratios réels — le barème du module fintech
  # reste indicatif tant qu'il n'a pas été recalé dessus par un humain.
  - id: cemac_microfinance_2017
    method: pdf
    url: https://www.sgg.cg/txts-droit-reg/cemac-reglement-2017-01-exercice-controle-microfinance.pdf
    schema: rag_fintech
    tags: [country:cg, country:cemac, module:microfinance, type:texte_legal, source:cobac, validated:true]
    license: règlement communautaire CEMAC (public, via SGG Congo)
    status: ready
    chunker: legal_article
    note: >-
      Règlement n°01/17/CEMAC/UMAC/COBAC du 27/09/2017 — conditions d'exercice
      et de contrôle de l'activité de microfinance (EMF) dans la CEMAC.
      Fondement du pôle fintech (agrément, catégories d'EMF, ratios prudentiels).
  # Les 3 entrées ci-dessous sont diffusées en SCAN (0 caractère extractible), ou
  # — pire pour le LBC-FT 2024 — avec une couche texte issue d'un mauvais OCR
  # d'origine : 203 000 caractères de charabia où les NOMBRES sont détruits
  # (« déclarer à l'ANIF … présence d'au moins ,, »).
  #
  # PIÈGE : ingest_pdf n'OCRise que si l'extraction rend < _MIN_TEXTE (400)
  # caractères. Il détecte le texte ABSENT, jamais le texte CORROMPU → sur --url,
  # le PDF 2024 franchirait le seuil et polluerait le corpus SILENCIEUSEMENT.
  # D'où `file:` ci-dessous : on ingère un texte RÉOCÉRISÉ depuis les images de
  # page (scripts/ocr_scan.py --dpi 300), la couche d'origine étant ignorée.
  # `url:` reste la provenance déclarée → les citations remontent au texte officiel.
  #
  # validated:false + ocr:true, DÉLIBÉRÉMENT : ces textes sont transcrits par
  # machine. Les seuils y sont lisibles et recoupables (le droit écrit les
  # montants en lettres ET en chiffres — « cinq millions (5.000.000) » — ce qui
  # fournit une somme de contrôle), mais le passage à validated:true suppose une
  # RELECTURE HUMAINE des chiffres. Un seuil AML faux a l'air sourcé.
  - id: cemac_lbcft_2024
    method: pdf
    url: https://gabac.org/wp-content/uploads/2025/05/Reglement-N%C2%B002CEMAC-UMAC-CM-LBC_FT-2024.pdf
    file: data/fintech/ocr/cemac_lbcft_2024.txt
    schema: rag_fintech
    tags: [country:cg, country:cemac, module:lbcft, type:texte_legal, source:gabac, ocr:true, validated:false]
    license: règlement communautaire CEMAC (public, via GABAC)
    status: ready
    chunker: legal_article
    note: >-
      Règlement n°02/24/CEMAC/UMAC/CM (2024) — LBC-FT, fondement du KYC/AML.
      C'est le texte À JOUR : il révise le n°01/CEMAC/UMAC/CM du 11/04/2016, qu'il
      ne faut donc PAS ingérer comme référence courante (texte abrogé). Réocérisé
      à 300 dpi (44 % de mots français reconnus) : les seuils détruits par la
      couche d'origine sont restitués — « déclarer à l'ANIF les transactions en
      espèces d'un montant égal ou supérieur à cinq millions (5.000.000) de
      Francs CFA », conservation « au moins dix (10) ans ». gabac.org renvoie 500
      sur un User-Agent minimal : UA de navigateur complet + Referer nécessaires.
  - id: cemac_services_paiement_2018
    method: pdf
    url: https://www.beac.int/wp-content/uploads/2019/07/REGLEMENT-N-04-18-CEMAC-UMAC-COBAC-du-21-d%C3%A9cembre-2018.pdf
    file: data/fintech/ocr/cemac_services_paiement_2018.txt
    schema: rag_fintech
    tags: [country:cg, country:cemac, module:paiements, type:texte_legal, source:beac, ocr:true, validated:false]
    license: règlement communautaire CEMAC (public, via BEAC)
    status: ready
    chunker: legal_article
    note: >-
      Règlement n°04/18/CEMAC/UMAC/COBAC du 21/12/2018 — services de paiement
      (prestataires, monnaie électronique / Mobile Money). Scan pur (29 pages,
      0 caractère) → réocérisé à 300 dpi, 46 % de mots français reconnus.
  - id: cemac_incidents_paiement_2016
    method: pdf
    url: https://www.beac.int/wp-content/uploads/2019/07/REGLEMENT-N-03-CEMAC-UMAC-CM-du-21-d%C3%A9cembre-2016.pdf
    file: data/fintech/ocr/cemac_incidents_paiement_2016.txt
    schema: rag_fintech
    tags: [country:cg, country:cemac, module:paiements, type:texte_legal, source:beac, ocr:true, validated:false]
    license: règlement communautaire CEMAC (public, via BEAC)
    status: ready
    chunker: legal_article
    note: >-
      Règlement n°03/CEMAC/UMAC/CM du 21/12/2016 — systèmes, moyens et incidents
      de paiement. Scan pur (84 pages, 0 caractère) → réocérisé à 300 dpi, 39 %
      de mots français reconnus.

  # ---- Cyber — standards internationaux + bonus local (rag_cyber) ------
  # Sourcing 2026-07-27 (docs/sourcing/cyber_2026.md). Doctrine : socle
  # INTERNATIONAL d'abord (NIST domaine public US, OWASP CC-BY-SA), bonus
  # LOCAL congolais ensuite (4 lois CG dédiées cyber, au-delà du seul
  # brief initial qui n'attendait que la loi 29-2019 + ARPCE). ISO 27001/
  # 27002 et CIS Controls/Benchmarks NE SONT PAS ingérés (ISO propriétaire,
  # CIS = CC BY-NC-SA incompatible avec un produit commercial) : repères de
  # structure uniquement, jamais de texte — voir §7 du sourcing.
  - id: nist_csf_2_0
    method: pdf
    url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
    schema: rag_cyber
    tags: [framework:nist, scope:international, lang:en, domaine:gouvernance, type:referentiel, validated:true, source:nist]
    license: domaine public (œuvre du gouvernement fédéral US, 17 U.S.C. §105)
    status: ready
    note: >-
      NIST Cybersecurity Framework 2.0 (26/02/2024) — Govern/Identify/
      Protect/Detect/Respond/Recover. URL vérifiée HTTP 200, texte natif
      confirmé (page 1 : "The NIST Cybersecurity Framework (CSF) 2.0").
  - id: nist_sp800_53r5
    method: pdf
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf
    schema: rag_cyber
    tags: [framework:nist, scope:international, lang:en, domaine:conformite, type:referentiel, validated:true, source:nist]
    license: domaine public (œuvre du gouvernement fédéral US, 17 U.S.C. §105)
    status: ready
    note: >-
      Security and Privacy Controls for Information Systems and
      Organizations, Rev. 5. Catalogue de contrôles — sert à qualifier les
      constats CYBER-1 (ex. AC-7 verrouillage de compte, SI-4 surveillance).
      492 pages, texte natif confirmé.
  - id: nist_sp800_61r3
    method: pdf
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r3.pdf
    schema: rag_cyber
    tags: [framework:nist, scope:international, lang:en, domaine:incident, type:guide, validated:true, source:nist]
    license: domaine public (œuvre du gouvernement fédéral US, 17 U.S.C. §105)
    status: ready
    note: >-
      Incident Response Recommendations and Considerations for
      Cybersecurity Risk Management: A CSF 2.0 Community Profile (04/2025).
      Remplace la Rev. 2 (Computer Security Incident Handling Guide) — NE
      PAS ingérer la Rev. 2, texte superseded (même écueil que LBC-FT
      2016 vs 2024 dans rag_fintech). Pertinent pour qualifier les
      constats de CYBER-2 (détection d'anomalies).
  - id: nist_sp800_171r3
    method: pdf
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-171r3.pdf
    schema: rag_cyber
    tags: [framework:nist, scope:international, lang:en, domaine:conformite, type:referentiel, validated:true, source:nist]
    license: domaine public (œuvre du gouvernement fédéral US, 17 U.S.C. §105)
    status: ready
    note: >-
      Protecting Controlled Unclassified Information in Nonfederal Systems
      and Organizations, Rev. 3 (05/2024). 120 pages, texte natif confirmé.
  - id: owasp_asvs_5_0
    method: pdf
    url: https://owasp.org/www-project-application-security-verification-standard/
    file: data/cyber/owasp_asvs_5_0.txt
    schema: rag_cyber
    tags: [framework:owasp, scope:international, lang:en, domaine:web, type:referentiel, validated:true, source:owasp]
    license: CC BY-SA 4.0 (attribution OWASP requise)
    status: ready
    note: >-
      Application Security Verification Standard 5.0.0 (05/2025). L'extraction
      PDF pypdf est CASSÉE (espaces perdus entre les mots) → réextrait via
      scripts/extract_owasp.py --asvs depuis la source markdown
      (github.com/OWASP/ASVS, tag v5.0.0_release, 5.0/en/, 27 chapitres :
      frontispice + V1-V17 + annexes). Identifiants d'exigence normalisés en
      forme complète (V1.2.3) pour rester citables après chunking. Chunker par défaut.
  # Licence OK mais aucun format ingérable avec method: pdf/hf_dataset —
  # cf. §4 du sourcing. Pas de url : rien à pointer qui soit un PDF unique.
  - id: owasp_top10
    method: pdf
    url: https://owasp.org/Top10/
    file: data/cyber/owasp_top10_2021.txt
    schema: rag_cyber
    tags: [framework:owasp, scope:international, lang:en, domaine:web, type:referentiel, validated:true, source:owasp]
    license: CC BY-SA 4.0 (dépôt github.com/OWASP/Top10 ; site owasp.org affiche 3.0 — attribution OWASP requise)
    status: ready
    note: >-
      Top 10:2021 (10 catégories A01-A10), web-only à l'origine → extrait en
      texte via scripts/extract_owasp.py depuis github.com/OWASP/Top10
      (2021/docs/en/) vers data/cyber/owasp_top10_2021.txt. Chunker par défaut
      (pas legal_article : ce ne sont pas des articles de loi).
  - id: owasp_cheatsheets
    method: pdf
    url: https://cheatsheetseries.owasp.org/
    file: data/cyber/owasp_cheatsheets.txt
    schema: rag_cyber
    tags: [framework:owasp, scope:international, lang:en, domaine:technique, type:guide, validated:true, source:owasp]
    license: CC BY-SA 4.0 (attribution OWASP requise)
    status: ready
    note: >-
      Cheat Sheet Series (120 fiches), diffusé en markdown
      (github.com/OWASP/CheatSheetSeries) → concaténé en texte via
      scripts/extract_owasp.py vers data/cyber/owasp_cheatsheets.txt (~2,5 Mo,
      volumineux : normal). Chunker par défaut.
  - id: mitre_attack_enterprise
    method: pdf
    url: https://attack.mitre.org/matrices/enterprise/
    file: data/cyber/mitre_attack_defensive.txt
    schema: rag_cyber
    tags: [framework:attack, scope:international, lang:en, domaine:technique, type:mapping, validated:true, source:mitre]
    license: "ATT&CK Terms of Use (réutilisation avec attribution) ; données STIX Apache-2.0"
    status: ready
    note: >-
      Matrice Enterprise (STIX 2.1 JSON, github.com/mitre-attack/attack-stix-data)
      → volet DÉFENSIF uniquement (description + détection + mitigations, pas de
      contenu offensif) extrait via scripts/extract_mitre_attack.py vers
      data/cyber/mitre_attack_defensive.txt. 697 techniques actives (~4,5 Mo).
      La détection provient du champ historique x_mitre_detection ou, sur les
      bundles récents, des objets x-mitre-detection-strategy/analytic (relation
      detects). Chunker par défaut.
  # ANSSI : conflit de licence non résolu, cf. §5 du sourcing. Colophon PDF
  # = "Licence Ouverte/Open Licence (Etalab V1)" (commercial OK a priori),
  # MAIS les mentions légales cyber.gouv.fr revendiquent une exception
  # d'autorisation préalable pour toute exploitation commerciale. NE PAS
  # passer en ready sans confirmation écrite ANSSI ou avis juridique.
  - id: anssi_hygiene_42_mesures
