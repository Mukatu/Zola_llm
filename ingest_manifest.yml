    license: "Licence Ouverte/Etalab V1 (colophon PDF) — CONFLIT avec l'exception commerciale des mentions légales cyber.gouv.fr, cf. sourcing §5"
    status: pending
    verify: true
    note: >-
      Guide d'hygiène informatique, 42 mesures, v2.0 (09/2017,
      ANSSI-GP-042). 72 pages, texte natif propre confirmé. Ingestion
      SUSPENDUE tant que le conflit de licence (§5 du sourcing) n'est pas
      tranché — produit commercial, pas de zone grise acceptable.
  - id: anssi_tpe_pme_13q
    method: pdf
    url: https://messervices.cyber.gouv.fr/documents-guides/20241212_np_anssi_guide_tpe-pme_v2.pdf
